<style>
/* Layout: datasheet-style portfolio. Sticky left rail (nav + links) on desktop, scrolling tab bar on phones.
   Entries use a mono date column beside the content, like a revision table. */
:root {
  --bg: #0d1312;
  --surface: #131c1a;
  --surface2: #1a2623;
  --line: #26342f;
  --fg: #e8eeeb;
  --muted: #93a39d;
  --accent: #e68b4c;      /* copper */
  --accent-ink: #1a0f07;
  --accent-soft: rgba(230, 139, 76, 0.14);
  --dot: rgba(147, 163, 157, 0.16);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f2; --surface: #ffffff; --surface2: #e9eee9; --line: #d3dad5;
    --fg: #101917; --muted: #52625d; --accent: #b4530f; --accent-ink: #ffffff;
    --accent-soft: rgba(180, 83, 15, 0.10); --dot: rgba(16, 25, 23, 0.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f2; --surface: #ffffff; --surface2: #e9eee9; --line: #d3dad5;
  --fg: #101917; --muted: #52625d; --accent: #b4530f; --accent-ink: #ffffff;
  --accent-soft: rgba(180, 83, 15, 0.10); --dot: rgba(16, 25, 23, 0.10);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.6 var(--f-body);
  padding-inline: 16px;
  padding-block: 0;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 22px 22px;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.mono { font-family: var(--f-mono); }
.label { font: 500 12px/1.3 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.shell { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 56px; padding-block: 40px 72px; }

/* ---- rail ---- */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 40px); align-self: start; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand b { font: 700 19px/1.1 var(--f-display); letter-spacing: -0.01em; }
.brand small { display: block; font: 400 12px/1.4 var(--f-mono); color: var(--muted); margin-top: 4px; }
.tools { display: flex; gap: 6px; }
.iconbtn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; font: 500 13px var(--f-mono); }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
nav ul { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font: 500 15px/1.3 var(--f-body); transition: color .15s, background .15s; }
nav a::before { content: ""; width: 14px; height: 1px; background: currentColor; opacity: .5; transition: width .2s, opacity .2s; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { color: var(--fg); background: var(--surface); }
nav a[aria-current="page"]::before { width: 22px; background: var(--accent); opacity: 1; }
.rail-links { display: flex; flex-direction: column; gap: 8px; }

/* ---- shared bits ---- */
.lnk { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1.3 var(--f-mono); color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
a.lnk:hover { border-bottom-color: var(--accent); }
.lnk.ph { color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; cursor: help; }
.lnk.ph i { font-style: normal; opacity: .75; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; font: 600 14px/1 var(--f-body); text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.tag { display: inline-block; font: 400 12px/1 var(--f-mono); padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: var(--surface); }

main { min-width: 0; }
.view[hidden] { display: none; }
.view { animation: rise .35s ease both; }
@keyframes rise { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 36px; }
.page-head h2 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.02em; }
.page-head p { color: var(--muted); max-width: 60ch; }

/* ---- home ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(40px, 7vw, 72px); letter-spacing: -0.03em; margin-block: 10px 16px; }
.hero .tagline { font: 500 clamp(17px, 2.2vw, 21px)/1.45 var(--f-body); max-width: 34ch; }
.hero .sum { color: var(--muted); max-width: 62ch; margin-top: 18px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.photo { position: relative; width: 220px; max-width: 100%; aspect-ratio: 1; justify-self: end; }
.photo svg.ring { position: absolute; inset: -18px; width: calc(100% + 36px); height: calc(100% + 36px); }
.photo .frame { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; }
.photo .frame img { width: 100%; height: 100%; object-fit: cover; }
.photo .frame span { font: 700 56px var(--f-display); color: var(--accent); letter-spacing: -0.02em; }
.photo .frame small { position: absolute; bottom: 22%; font: 400 11px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 52px; border-block: 1px solid var(--line); }
.stat { padding: 20px 16px 20px 0; display: flex; flex-direction: column; gap: 6px; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--line); }
.stat b { font: 700 28px/1.1 var(--f-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); line-height: 1.4; }

.spec { margin-top: 44px; }
.spec h3 { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.spec dl { margin: 0; display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr); border-top: 1px solid var(--line); }
.spec dt, .spec dd { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--line); }
.spec dt { font: 400 13px/1.5 var(--f-mono); color: var(--muted); }
.spec dd { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 15px; }
.copy { appearance: none; background: none; border: 1px solid var(--line); color: var(--muted); font: 400 11px var(--f-mono); border-radius: 5px; padding: 3px 7px; cursor: pointer; }
.copy:hover { color: var(--accent); border-color: var(--accent); }

/* ---- entries ---- */
.entries { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 28px; padding-block: 28px; border-top: 1px solid var(--line); }
.entry:last-child { border-bottom: 1px solid var(--line); }
.when { font: 400 13px/1.6 var(--f-mono); color: var(--muted); }
.when b { display: block; color: var(--fg); font-weight: 500; }
.entry h3 { font-size: 22px; letter-spacing: -0.01em; }
.entry .org { color: var(--muted); margin-top: 4px; font-size: 15px; }
.entry .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; }
.entry ul.pts { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.entry ul.pts li { position: relative; padding-left: 20px; max-width: 76ch; font-size: 15px; }
.entry ul.pts li::before { content: ""; position: absolute; left: 0; top: .72em; width: 10px; height: 1px; background: var(--accent); }
.entry .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.entry .gpa { font: 700 15px var(--f-display); color: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.steps div { font: 400 13px/1.5 var(--f-mono); color: var(--muted); }
.steps div b { color: var(--fg); font-weight: 500; }

/* ---- skills ---- */
.groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
.group h3 { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.group .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.group .tag { background: var(--bg); color: var(--fg); }
.group.wide { grid-column: 1 / -1; }

/* ---- certifications ---- */
.certs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cert { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; padding-block: 18px; border-bottom: 1px solid var(--line); align-items: center; }
.cert b { font: 600 16px/1.35 var(--f-body); display: block; }
.cert span.by { font: 400 13px/1.5 var(--f-mono); color: var(--muted); }
.cert .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

/* ---- resume ---- */
.rbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 16px; margin-bottom: 18px; }
.rbar label { display: flex; flex-direction: column; gap: 6px; }
.rbar select { appearance: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 36px 10px 12px; font: 500 14px var(--f-body); min-width: 220px; max-width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.rframe { width: 100%; height: min(78vh, 900px); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.rnote { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* ---- share dialog ---- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5, 9, 8, 0.7); }
.modal[hidden] { display: none; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
.sheet h3 { font-size: 24px; }
.sheet p { color: var(--muted); font-size: 14px; }
.qr { background: #fff; padding: 14px; border-radius: 12px; line-height: 0; }
.qr img { width: 224px; height: 224px; max-width: 100%; image-rendering: pixelated; display: block; }
.urlrow { display: flex; gap: 8px; width: 100%; align-items: center; }
.urlrow code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 400 12px var(--f-mono); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; text-align: left; background: var(--bg); }

footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); font: 400 12px/1.5 var(--f-mono); color: var(--muted); }

/* ---- phone / tablet ---- */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 0 56px; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; gap: 8px; padding-block: 12px 8px; margin-inline: -16px; padding-inline: 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav { margin-inline: -16px; }
  nav ul { flex-direction: row; overflow-x: auto; gap: 4px; padding-inline: 16px; scrollbar-width: none; }
  nav ul::-webkit-scrollbar { display: none; }
  nav a { white-space: nowrap; padding: 8px 12px; }
  nav a::before { display: none; }
  nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .rail-links { display: none; }
  .brand small { display: none; }
  main { padding-top: 32px; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .photo { order: -1; justify-self: start; width: 150px; margin: 14px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .entry { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .groups { grid-template-columns: minmax(0, 1fr); }
  .cert { grid-template-columns: minmax(0, 1fr); }
  .cert .links { justify-content: flex-start; }
  .spec dl { grid-template-columns: minmax(0, 1fr); }
  .spec dt { padding-bottom: 0; border-bottom: 0; }
  .spec dd { padding-top: 4px; }
}
@media (prefers-reduced-motion: reduce) { .view { animation: none; } html { scroll-behavior: auto; } }
</style>

function show() {

  document.querySelectorAll("nav a").forEach(a => { if (a.dataset.tab === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const cur = $("nav a[aria-current]"); if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {} }
  window.scrollTo(0, 0);
}

/* copy buttons */
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const r = document.createRange(); const n = btn.previousElementSibling; if (n) { r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
  const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = o, 1400);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (b) copyText(b.dataset.copy, b);
});

/* theme */
const root = document.documentElement;
try { const t = localStorage.getItem("kk-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark"; root.dataset.theme = next;
  try { localStorage.setItem("kk-theme", next); } catch (e) {}
});

/* QR share: encodes this page's address (without the tab hash) */
const dlg = $("#share");
function openShare() {
  const url = location.href.split("#")[0];
  $("#qrUrl").textContent = url;
  try {
    const q = qrcode(0, "M"); q.addData(url); q.make();
    $("#qrImg").src = q.createDataURL(8, 0);
  } catch (e) { $("#qrImg").alt = "QR code could not be generated"; }
  dlg.hidden = false; $("#closeShare").focus();
}
$("#shareBtn").addEventListener("click", openShare);
$("#closeShare").addEventListener("click", () => { dlg.hidden = true; $("#shareBtn").focus(); });
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !dlg.hidden) dlg.hidden = true; });
$("#copyUrl").addEventListener("click", e => copyText($("#qrUrl").textContent, e.currentTarget));
